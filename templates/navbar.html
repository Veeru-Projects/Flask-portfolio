<!DOCTYPE html>
<html lang="en">
<head>
  <title>Portfolio Website-Veerender</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/favicon.ico') }}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- linking css file -->
  <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
  <!-- bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- font awesome via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pVn8+OxqVhExt6aJoH4Y3A+N1zOfKgGFSvYHamdTHSXmw7w00HhpLe01u0r5z5vHkKV+1QTNuj5wKekSO3vCIw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#">Veerender</a>
            <!-- theme switch -->
            <div class="form-check form-switch ms-3">
                <input class="form-check-input" type="checkbox" id="themeToggle">
                <label class="form-check-label" for="themeToggle">Dark</label>
            </div>
            <nav class="navbar navbar-expand-lg fixed-top data-bs-target="#navbarSupportedContent" data-bs-offset="80"></nav>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('about') }}">About</a>
                    </li>
                    <!-- <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('portfolio') }}">Portfolio</a>
                    </li>     -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('static',filename='Resume.pdf') }}" target="_blank" rel="noopener noreferrer" >Resume</a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>
    <!-- main banner -->
    <section class="bgimage" id="home">
        <div class="container-fluid">
            <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 hero-text">
                <h2 class="text-left">Hey, Veerender Mothukuri Here!</h2>
                <p class="text-left">"Welcome to my portfolio"</p>
            </div>
            </div>
        </div>
    </section>

    <!-- load javascript after loading all html content -->
    <script src="{{ url_for('static',filename='script/script.js') }}"></script>
{% block content %}
{% endblock %}
</body>
</html>
